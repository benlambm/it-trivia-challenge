# /etc/systemd/system/trivia-api.service.d/20-state.conf
# Writable home for the analytics events file. ProtectSystem=strict makes the
# rest of the filesystem read-only, and /opt/trivia-app is hard-reset on every
# deploy, so the data lives outside the repo. systemd creates the directory,
# owns it to the service user and sets STATE_DIRECTORY=/var/lib/trivia-api,
# which api/index.js uses for events.jsonl.
[Service]
StateDirectory=trivia-api
StateDirectoryMode=0750
